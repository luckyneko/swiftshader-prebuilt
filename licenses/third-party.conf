# Every third-party component compiled into vk_swiftshader, and where its licence text lives.
#
# check.sh reads the driver's actual link line and fails when it names a third_party/ directory
# that is not listed here, so a dependency upstream adds cannot reach a release without its
# licence. package.sh concatenates these into THIRD_PARTY_LICENSES.txt.
#
# <component>|<licence file>, the file being a path in the upstream tree, or under licenses/ in
# this repository where upstream's vendored copy omits it.
THIRD_PARTY_LICENSES=(
	"astc-encoder|third_party/astc-encoder/LICENSE.txt"
	# SwiftShader vendors LLVM 10 without its LICENSE.TXT; every file states
	# "Apache-2.0 WITH LLVM-exception". This is that text, from llvm-project at llvmorg-10.0.0.
	"llvm-10.0|licenses/llvm-10.0-LICENSE.TXT"
	"marl|third_party/marl/LICENSE"
	"SPIRV-Tools|third_party/SPIRV-Tools/LICENSE"
	# No library of its own: its SPIR-V grammar tables are compiled into SPIRV-Tools.
	"SPIRV-Headers|third_party/SPIRV-Headers/LICENSE"
)
