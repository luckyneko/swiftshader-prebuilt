PLATFORM_SYSTEM=Windows # the directory SwiftShader's build leaves the ICD in
PLATFORM_LIBRARY=vk_swiftshader.dll

PLATFORM_CMAKE_ARGS=(
	# Named explicitly, as upstream's own Windows CI does: the runner has other compilers on PATH
	# (MinGW, Strawberry Perl's GCC) that CMake would otherwise prefer.
	-DCMAKE_C_COMPILER=cl
	-DCMAKE_CXX_COMPILER=cl
	# The static CRT. With the default (/MD) the DLL imports VCRUNTIME140 and MSVCP140, which are
	# present on a machine with Visual Studio or the VC++ redistributable and absent on a fresh
	# Windows install — so it would load on every CI runner and fail on end users' machines.
	-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
)
