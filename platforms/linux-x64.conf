# Built on the oldest supported glibc runner (ubuntu-22.04, glibc 2.35), so the driver loads on
# every distribution at least that new. A newer runner would raise that floor silently: the build
# would still pass, and the failure would surface only on an older machine.
PLATFORM_SYSTEM=Linux # the directory SwiftShader's build leaves the ICD in
PLATFORM_LIBRARY=libvk_swiftshader.so

PLATFORM_CMAKE_ARGS=(
	# GCC 12 is the newest GCC that ubuntu-22.04 ships whose libstdc++ is also the system's own,
	# so the GLIBCXX versions it references exist wherever glibc 2.35 does. Upstream's own CI
	# builds with GCC 13.
	-DCMAKE_C_COMPILER=gcc-12
	-DCMAKE_CXX_COMPILER=g++-12
)

# The newest glibc symbol version the driver may require. check.sh asserts it, because nothing
# else would notice the floor moving.
PLATFORM_MAX_GLIBC=2.35
