PLATFORM_SYSTEM=Darwin # the directory SwiftShader's build leaves the ICD in
PLATFORM_LIBRARY=libvk_swiftshader.dylib

PLATFORM_CMAKE_ARGS=(
	-DCMAKE_OSX_ARCHITECTURES=arm64
	# SwiftShader sets no deployment target, so without one the dylib's floor is whatever SDK the
	# runner has: a local build on macOS 26 came out minos 26.0, and would refuse to load on any
	# older Mac. 11.0 is the first macOS with arm64 at all.
	-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
)

# The minimum macOS the dylib records (LC_BUILD_VERSION minos). check.sh asserts it.
PLATFORM_MIN_OS=11.0
