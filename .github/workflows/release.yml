name: release

# Build one pinned SwiftShader commit for every supported platform, prove each driver is what its
# archive claims, and publish the set as a GitHub Release.
#
# Manual dispatch only. Consumers pin every archive by SHA256 in their build files, so a release
# is a decision someone makes, never something a push triggers — and a published one is never
# replaced: the publish job refuses a tag that already exists.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Upstream SwiftShader commit (full 40-character SHA)"
        required: true
        default: "cddb5c91b23ff70a1f607ea31610aa0d7f4b5ad5"
      revision:
        description: "Re-release suffix for a commit that is already published (r2, r3, ...); empty otherwise"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub Release (otherwise build and verify only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false # one platform failing must not hide the others' results
      matrix:
        include:
          # The oldest supported glibc runner: its glibc is the floor of the Linux archive.
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x64, runner: windows-2022 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      # Ninja + cl.exe, the way upstream's own Windows CI builds (vcvarsall x64).
      # Before get-cmake: the developer environment puts Visual Studio's own CMake on PATH, and
      # the pinned one has to land ahead of it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      # CMake pinned to the series upstream's own CI uses. A CMake 4 would refuse the vendored marl,
      # which still declares cmake_minimum_required(VERSION 3.0). Also provides Ninja everywhere.
      - uses: lukka/get-cmake@v3.31.6

      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-12

      - name: Fetch and verify upstream source
        run: bash ./scripts/fetch-source.sh "${{ inputs.commit }}" "${{ inputs.revision }}"

      - name: Build
        run: PLATFORM="${{ matrix.platform }}" bash ./scripts/build.sh

      # Before packaging, not after: an archive whose driver does not do what it claims must never
      # reach a release.
      - name: Verify the driver matches its archive's claims
        run: bash ./scripts/check.sh "${{ matrix.platform }}"

      - name: Package
        env:
          BUILD_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          bash ./scripts/package.sh "${{ matrix.platform }}"
          { echo '```'; cat dist/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: swiftshader-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }

      - name: Resolve the release tag
        id: tag
        run: |
          cd dist
          archives="$(ls swiftshader-*.tar.gz)"
          tags="$(echo "$archives" | sed -E 's/^swiftshader-(.+)-(linux-x64|macos-arm64|windows-x64)\.tar\.gz$/\1/' | sort -u)"
          if [ "$(echo "$archives" | wc -l)" != 3 ] || [ "$(echo "$tags" | wc -l)" != 1 ]; then
            echo "expected three archives under one tag, got:"; echo "$archives"; exit 1
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"

      # Every consumer pins each archive's SHA256, so replacing a published asset would break every
      # pin at once, silently for anyone with the old archive cached. Releases are append-only; a
      # rebuild of a published commit takes a revision suffix instead.
      - name: Refuse to replace an existing release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release ${{ steps.tag.outputs.tag }} already exists; dispatch again with a revision (r2, ...)"
            exit 1
          fi

      # SHA256SUMS is part of the release rather than a convenience: it is what a consuming build
      # system pins against.
      - name: Checksums and release notes
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum swiftshader-*.tar.gz | tee SHA256SUMS
          commit="${{ inputs.commit }}"
          patches="$(tar -xzOf "$(ls swiftshader-*.tar.gz | head -1)" MANIFEST.txt | awk '/^patches$/{f=1; next} /^$/{f=0} f')"
          {
            echo "SwiftShader's Vulkan driver (a CPU implementation of Vulkan 1.3) as a Vulkan ICD, built"
            echo "from upstream commit [\`${commit}\`](https://swiftshader.googlesource.com/SwiftShader/+/${commit})."
            echo
            echo "Patches:"
            echo '```'
            echo "$patches"
            echo '```'
            echo
            echo "Each archive holds, at its root, \`vk_swiftshader_icd.json\` (whose \`library_path\` is"
            echo "relative to itself), the driver library, \`LICENSE.txt\`, \`THIRD_PARTY_LICENSES.txt\` and"
            echo "\`MANIFEST.txt\`. Before publication every driver was loaded through its own ICD manifest and"
            echo "required to report a CPU device with Vulkan 1.3, synchronization2 and dynamicRendering, and"
            echo "to depend on nothing outside the operating system."
            echo
            echo "| archive | sha256 |"
            echo "| --- | --- |"
            while read -r hash file; do echo "| \`${file}\` | \`${hash}\` |"; done < SHA256SUMS
            echo
            echo "Build scripts: this repository at \`${{ github.sha }}\`."
            echo
            echo "**macOS:** the dylib is ad-hoc signed but not notarized. Downloaded in a browser it is"
            echo "quarantined and macOS will refuse to load it; clear that with"
            echo "\`xattr -dr com.apple.quarantine <extracted-dir>\`. Downloads by curl, wget or CMake's"
            echo "FetchContent are unaffected."
          } > ../NOTES.md
          cat ../NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SwiftShader ${{ steps.tag.outputs.tag }}
          body_path: NOTES.md
          files: dist/*
